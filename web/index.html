<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ApexFire: explore North Macedonia's satellite fire detections, observed incident evidence and an experimental spread scenario, with sources and limits visible." />
    <meta name="theme-color" content="#0C0D0A" />
    <link rel="icon" type="image/svg+xml" href="/apexfire-icon.svg" />
    <!-- Link previews (Viber, Facebook, WhatsApp, X, LinkedIn). Crawlers do not run JavaScript, so these are static and site-wide;
         %SITE_URL% is filled in at build time (vite.config.ts) because previews need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ApexFire" />
    <meta property="og:title" content="ApexFire — North Macedonia's fire tracker and fire evidence archive" />
    <meta property="og:description" content="Satellite fire detections since 2000, live wind and fire danger, and day-by-day stories of real fires, with sources and limits visible." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/apexfire-share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ApexFire: an orange iris with a flame-shaped pupil, beside the words North Macedonia's fire tracker and fire evidence archive" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ApexFire — North Macedonia's fire tracker and fire evidence archive" />
    <meta name="twitter:description" content="Satellite fire detections since 2000, live wind and fire danger, and day-by-day stories of real fires." />
    <meta name="twitter:image" content="%SITE_URL%/apexfire-share.png" />
    <title>ApexFire — North Macedonia satellite fire activity</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ApexFire needs JavaScript to display its data explorer. Source data and methods are documented in the project repository.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
